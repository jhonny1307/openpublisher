<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenPublisher</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0;padding:20px}#app{max-width:900px;margin:auto}button{background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{background:#333}#menu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.item{border:1px solid #333;border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}.item:hover{background:#1b1b1b}pre{white-space:pre-wrap}.hidden{display:none}
</style>
</head>
<body>
<div id="app">
<div id="menu"></div>
<div id="content">"Nada" foi encontrado</div>
</div>
<script>
const REPO="jhonny1307/openpublisher";
let csvRows=[];
let indexRow=null;

async function loadCSV(){
 const response=await fetch(`https://raw.githubusercontent.com/${REPO}/main/list.csv`);
 const text=await response.text();
 csvRows=text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>line.split(";"));
 indexRow=null;
 for(const row of csvRows){
  if(row[0].trim().startsWith("!index")) indexRow=row;
 }
 buildMenu();
 if(indexRow) await openRow(indexRow);
}

function buildMenu(){
 const menu=document.getElementById("menu");
 menu.innerHTML="";
 for(const row of csvRows){
  if(row[0].trim().startsWith("!index")) continue;
  if(!row[0].trim()) continue;
  const item=document.createElement("div");
  item.className="item";
  item.textContent=row[0];
  item.onclick=()=>openRow(row);
  menu.appendChild(item);
 }
}

async function openRow(row){
 const name=(row[0]||"").trim();
 if(!name) return;
 const file=`${name}.md`;
 try{
  const response=await fetch(`https://raw.githubusercontent.com/${REPO}/main/${encodeURIComponent(file)}`);
  if(!response.ok) throw new Error("not found");
  document.getElementById("content").innerHTML=`<pre>${escapeHtml(await response.text())}</pre>`;
 }catch(e){
  document.getElementById("content").textContent=`"${name}" foi encontrado, mas seu conteúdo não pôde ser carregado.`;
 }
}

function escapeHtml(text){
 return text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadCSV();
</script>
</body>
</html>
